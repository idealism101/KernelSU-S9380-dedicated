name: Build KernelSU Kernel Module

on:
  workflow_call:
    inputs:
      kmi:
        description: 'KMI version'
        required: true
        type: string
      ddk_release:
        description: 'DDK release version'
        required: false
        default: '20260828'
        type: string
      expected_size2:
        description: 'Second expected signature size (for PR builds)'
        required: false
        default: ''
        type: string
      expected_hash2:
        description: 'Second expected signature hash (for PR builds)'
        required: false
        default: ''
        type: string

jobs:
  build-kernelsu-ko:
    name: Build kernelsu.ko for ${{ inputs.kmi }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:${{ inputs.kmi }}-${{ inputs.ddk_release }}
      options: --privileged

    steps:
    - name: Checkout source code
      uses: actions/checkout@v7

    # ----------------------------------------------------------------------
    # Device-exact vermagic override for Samsung Galaxy S25 Ultra (pa3q/S9380)
    # Kernel: 6.6.77-android15-8-2755199-abogkiS9380ZCU5BYI3-4k
    # The DDK container's android15-6.6 kernel tree carries a generic GKI
    # release string. Overriding UTS_RELEASE makes the built .ko's vermagic
    # match `uname -r` EXACTLY so init_module() accepts it on the device.
    # (Same technique already proven in the DFRoot dfroot-build pipeline.)
    # ----------------------------------------------------------------------
    - name: Override kernel release for SM-S9380 (android15-6.6 only)
      if: inputs.kmi == 'android15-6.6'
      run: |
        echo "KDIR=$KDIR"
        printf '#define UTS_RELEASE "%s"\n' "6.6.77-android15-8-2755199-abogkiS9380ZCU5BYI3-4k" > "$KDIR/include/generated/utsrelease.h"
        printf '%s\n' "6.6.77-android15-8-2755199-abogkiS9380ZCU5BYI3-4k" > "$KDIR/include/config/kernel.release"
        cat "$KDIR/include/generated/utsrelease.h"

    - name: Build kernelsu.ko
      env:
        EXPECTED_SIZE2: ${{ inputs.expected_size2 }}
        EXPECTED_HASH2: ${{ inputs.expected_hash2 }}
      run: |
        git config --global --add safe.directory /__w/KernelSU/KernelSU

        cd kernel

        echo "=== Building kernelsu.ko for KMI: ${{ inputs.kmi }} ==="

        EXTRA_ARGS=""
        if [ -n "$EXPECTED_SIZE2" ] && [ -z "$EXPECTED_HASH2" ]; then
          echo "ERROR: expected_hash2 must be provided when expected_size2 is set."
          exit 1
        fi
        if [ -z "$EXPECTED_SIZE2" ] && [ -n "$EXPECTED_HASH2" ]; then
          echo "ERROR: expected_size2 must be provided when expected_hash2 is set."
          exit 1
        fi
        if [ -n "$EXPECTED_SIZE2" ]; then
          EXTRA_ARGS="KSU_EXPECTED_SIZE2=$EXPECTED_SIZE2 KSU_EXPECTED_HASH2=$EXPECTED_HASH2"
        fi
        CONFIG_KSU=m CONFIG_KSU_SAMSUNG_KDP=y CONFIG_KSU_SAMSUNG_DEFEX=y CONFIG_KSU_RKP_NO_PATCH_TEXT=y CONFIG_SECTION_MISMATCH_WARN_ONLY=y CC=clang make $EXTRA_ARGS
        
        echo "=== Build completed ==="

        # Create output directory in GitHub workspace
        OUT_DIR=/github/workspace/out/aarch64
        mkdir -p $OUT_DIR

        # Copy with KMI-specific naming
        OUTPUT_NAME="${{ inputs.kmi }}_kernelsu.ko"
        cp kernelsu.ko "$OUT_DIR/$OUTPUT_NAME"
        
        echo "Copied to: $OUT_DIR/$OUTPUT_NAME"
        ls -la "$OUT_DIR/$OUTPUT_NAME"
        echo "Size: $(du -h "$OUT_DIR/$OUTPUT_NAME" | cut -f1)"
        llvm-strip -d "$OUT_DIR/$OUTPUT_NAME"
        echo "Size after stripping: $(du -h "$OUT_DIR/$OUTPUT_NAME" | cut -f1)"

    - name: Assert vermagic matches the device (android15-6.6 only)
      if: inputs.kmi == 'android15-6.6'
      run: |
        KO="/github/workspace/out/aarch64/android15-6.6_kernelsu.ko"
        VM=$(strings "$KO" | grep '^vermagic=')
        WANT="vermagic=6.6.77-android15-8-2755199-abogkiS9380ZCU5BYI3-4k SMP preempt mod_unload modversions aarch64"
        echo "got  : $VM"
        echo "want : $WANT"
        if [ "$VM" != "$WANT" ]; then
          echo "::error::vermagic mismatch"
          exit 1
        fi
        echo "VERMAGIC MATCHES DEVICE"
        echo "=== manager-signature trust slots ==="
        echo "SIZE1/HASH1 (author, default): 0x02d6 / 195bf7247e66ed412bdabad9bc8b3a7293f892b8aa6ff296ab0e9d2c32f47e2d"
        echo "SIZE2/HASH2 (ours):           ${{ inputs.expected_size2 }} / ${{ inputs.expected_hash2 }}"

    - name: Upload kernelsu.ko artifact
      uses: actions/upload-artifact@v7
      with:
        name: aarch64-${{ inputs.kmi }}-lkm
        path: /github/workspace/out/aarch64/${{ inputs.kmi }}_kernelsu.ko
